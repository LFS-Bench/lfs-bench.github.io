    /* 整个容器 */

      flex-wrap: wrap;
      justify-content: space-between;

    /* 切换按钮样式 */

    let currentIndex = 0;

    const modelTextContainer = document.querySelector(".model-text-container");
    const imageElement = document.querySelector(".img-container2 img");
    const contentRight = document.querySelector(".content-right");

    // 可选：切页时暂停所有音频，避免多个同时播放
    function pauseAllAudios() {
      document.querySelectorAll("audio").forEach(a => {
        a.pause();
        a.currentTime = 0;
      });
    }

    function updateGlowClass(title) {
      contentRight.classList.remove("acoustics", "semantics", "expressiveness");
      if (title === "Acoustics") contentRight.classList.add("acoustics");
      if (title === "Semantics") contentRight.classList.add("semantics");
      if (title === "Expressiveness") contentRight.classList.add("expressiveness");
    }

    function updateContent() {
      pauseAllAudios();

      const content = contentList[currentIndex];

      // 标题 & 文本
      document.querySelector(".content-right h1").textContent = content.title;
      const headerP = document.querySelector(".content-header p");
      headerP.innerHTML = `<strong>${content.headerLabel}</strong> ${content.headerText}`;

      // 三个模型：各自音频
      modelTextContainer.innerHTML = content.models.map((m) => {
        return `
          <div class="model-row">
            <p class="model-text">${m.name}</p>
            <div class="audio-container">
              <audio controls preload="none">
                <source src="${m.audio}" type="audio/wav">
                Your browser does not support the audio element.
              </audio>
            </div>
          </div>
        `;
      }).join("");

      // 图片
      imageElement.src = content.image;

      // 发光 class
      updateGlowClass(content.title);
    }

    document.querySelector(".swiper-button-prev").addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + contentList.length) % contentList.length;
      updateContent();
    });

    document.querySelector(".swiper-button-next").addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % contentList.length;
      updateContent();
    });

    // 初始化
    updateContent();
  </script>
