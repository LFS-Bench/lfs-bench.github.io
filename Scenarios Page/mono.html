  <style>
    /* 整个容器 */
    .content-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding-top: 20px;
    }

    /* 主要内容容器 */
    .content-right {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%;
      height: auto;
      padding: 20px;
      background: #ffffff;
      border-radius: 5px;
      transition: box-shadow 0.2s ease-in-out;
      box-shadow: none;
    }

    /* 在鼠标悬浮时发光 */
    .content-right:hover {
      box-shadow: 0 0 10px 10px;
    }

    /* 针对不同的标题动态修改 hover 发光颜色 */
    .content-right.acoustics:hover {
      box-shadow: 0 0 20px 10px #f1c7d5;
    }

    .content-right.semantics:hover {
      box-shadow: 0 0 20px 10px #c0e5eb;
    }

    .content-right.expressiveness:hover {
      box-shadow: 0 0 20px 10px #f4f5c3;
    }

    /* 模型和音频控件容器 */
    .model-text-container {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      width: 100%;
    }

    /* 每个模型名称和音频控件 */
    .model-row {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 10px 5px;
      width: 30%;
    }

    /* 模型文本样式 */
    .model-text {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    /* 音频控件 */
    .audio-container audio {
      margin-left: 5px;
      width: 275px;
    }

    /* 切换按钮样式 */
    .swiper-button {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 2em;
      color: #333;
      background-color: rgba(255, 255, 255, 0.5);
      padding: 10px;
      cursor: pointer;
      z-index: 10;
    }

    .swiper-button:hover {
      color: #ffffff;
      background-color: rgba(58, 56, 56, 0.6);
    }

    .swiper-button-prev { left: 10px; }
    .swiper-button-next { right: 10px; }

    /* 内容头部文本容器 */
    .content-header {
      background-color: #f0f0f0;
      width: 100%;
      padding: 15px;
      text-align: left;
      margin-bottom: 20px;
      border-radius: 5px;
    }
    .img-container2 {
      display: flex;
      justify-content: center;
      margin-right: 8%;
      align-items: center;
      width: 100%;
      height: 200px; /* 你可以调整高度以适应图片的大小 */
    }

        ]

    let currentIndex = 0;

    const modelTextContainer = document.querySelector(".model-text-container");
    const imageElement = document.querySelector(".img-container2 img");
    const contentRight = document.querySelector(".content-right");

    // 可选：切页时暂停所有音频，避免多个同时播放
    function pauseAllAudios() {
      document.querySelectorAll("audio").forEach(a => {
        a.pause();
        a.currentTime = 0;
      });
    }

    function updateGlowClass(title) {
      contentRight.classList.remove("acoustics", "semantics", "expressiveness");
      if (title === "Acoustics") contentRight.classList.add("acoustics");
      if (title === "Semantics") contentRight.classList.add("semantics");
      if (title === "Expressiveness") contentRight.classList.add("expressiveness");
    }

    function updateContent() {
      pauseAllAudios();

      const content = contentList[currentIndex];

      // 标题 & 文本
        document.querySelector(".content-right h1").textContent = content.title;
        const headerP = document.querySelector(".content-header p");
         headerP.innerHTML = `<strong>${content.headerLabel}</strong> ${content.headerText}`;

      // 三个模型：各自音频
      modelTextContainer.innerHTML = content.models.map((m) => {
        return `
          <div class="model-row">
            <p class="model-text">${m.name}</p>
            <div class="audio-container">
              <audio controls preload="none">
                <source src="${m.audio}" type="audio/wav">
                Your browser does not support the audio element.
              </audio>
            </div>
          </div>
        `;
      }).join("");

      // 图片
      imageElement.src = content.image;

      // 发光 class
      updateGlowClass(content.title);
    }

    document.querySelector(".swiper-button-prev").addEventListener("click", () => {
      currentIndex = (currentIndex - 1 + contentList.length) % contentList.length;
      updateContent();
    });

    document.querySelector(".swiper-button-next").addEventListener("click", () => {
      currentIndex = (currentIndex + 1) % contentList.length;
      updateContent();
    });

    // 初始化
    updateContent();
  </script>
